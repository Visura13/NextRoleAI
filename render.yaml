# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: nextroleai-db
    databaseName: nextroleai
    user: nextroleai
    plan: free
    postgresMajorVersion: "17"
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: nextroleai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nextroleai-db
          property: connectionString
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Jwt__Issuer
        value: NextRoleAI.Api
      - key: Jwt__Audience
        value: NextRoleAI.Clients
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: CvStorage__RootPath
        value: /tmp/nextroleai-cvs
      - key: CvAi__Enabled
        value: "true"
      - key: CvAi__BaseUrl
        value: https://api.openai.com/v1/
      - key: CvAi__ApiKey
        sync: false
      - key: CvAi__Model
        sync: false
      - key: Notifications__Enabled
        value: "false"
      - key: Notifications__ResendApiKey
        sync: false
      - key: Notifications__FromAddress
        sync: false

  - type: web
    name: nextroleai-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
